name: Backend CI

on:
  pull_request:
    paths:
      - 'afrinov-platform/apps/backend/**'
      - 'afrinov-platform/package.json'
      - 'afrinov-platform/package-lock.json'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'afrinov-platform/apps/backend/**'
      - 'afrinov-platform/package.json'
      - 'afrinov-platform/package-lock.json'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: afrinov-platform/apps/backend

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 20 matches the Docker image (apps/backend/Dockerfile).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: afrinov-platform/package-lock.json

      # The lockfile lives at the workspace root, so install from there.
      - name: Install dependencies
        working-directory: afrinov-platform
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  integration:
    name: Integration tests (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: afrinov
          POSTGRES_PASSWORD: afrinov
          POSTGRES_DB: afrinov_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afrinov -d afrinov_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway database that only exists for the length of this job.
      DATABASE_URL: postgresql://afrinov:afrinov@localhost:5432/afrinov_test?schema=public
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: afrinov-platform/package-lock.json

      - name: Install dependencies
        working-directory: afrinov-platform
        run: npm ci

      # Fresh random values per run, so no credential is stored in this file.
      - name: Generate throwaway secrets
        run: |
          jwt=$(node -e "console.log(require('node:crypto').randomBytes(48).toString('base64url'))")
          admin=$(node -e "console.log(require('node:crypto').randomBytes(24).toString('base64url'))")
          echo "::add-mask::$jwt"
          echo "::add-mask::$admin"
          echo "JWT_SECRET=$jwt" >> "$GITHUB_ENV"
          echo "SEED_ADMIN_PASSWORD=$admin" >> "$GITHUB_ENV"

      - name: Generate Prisma client
        run: npx prisma generate

      # Same migration and seed steps the production container runs on start.
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npm run db:seed

      - run: npm run test:integration
