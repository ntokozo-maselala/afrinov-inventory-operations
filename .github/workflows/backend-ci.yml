name: Backend CI

on:
  pull_request:
    paths:
      - 'afrinov-platform/apps/backend/**'
      - 'afrinov-platform/package.json'
      - 'afrinov-platform/package-lock.json'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'afrinov-platform/apps/backend/**'
      - 'afrinov-platform/package.json'
      - 'afrinov-platform/package-lock.json'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: afrinov-platform/apps/backend

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Vitest 5 requires Node 22.12 or later; use the same supported major as
      # the frontend workflow and local development guidance.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: afrinov-platform/package-lock.json

      # The lockfile lives at the workspace root, so install from there.
      - name: Install dependencies
        working-directory: afrinov-platform
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  migration-drift:
    name: Migration drift and database integrity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: afrinov
          POSTGRES_PASSWORD: afrinov
          POSTGRES_DB: afrinov_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afrinov -d afrinov_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://afrinov:afrinov@localhost:5432/afrinov_test?schema=public
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: afrinov-platform/package-lock.json

      - name: Install dependencies
        working-directory: afrinov-platform
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Applies every committed migration to an empty database. A migration
      # that cannot run fails here, before it can reach a real environment.
      - name: Apply migrations to a clean database
        run: npx prisma migrate deploy

      # Proves the migrated database matches the Prisma schema exactly. A
      # missing constraint or column (like DATA-03) shows up as a non-empty
      # diff, and `--exit-code` turns that into a failing exit status (2).
      - name: Verify migrations match the schema
        run: |
          set -euo pipefail
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --script --exit-code

  integration:
    name: Integration tests (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: afrinov
          POSTGRES_PASSWORD: afrinov
          POSTGRES_DB: afrinov_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afrinov -d afrinov_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway database that only exists for the length of this job.
      DATABASE_URL: postgresql://afrinov:afrinov@localhost:5432/afrinov_test?schema=public
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: afrinov-platform/package-lock.json

      - name: Install dependencies
        working-directory: afrinov-platform
        run: npm ci

      # Fresh random values per run, so no credential is stored in this file.
      - name: Generate throwaway secrets
        run: |
          jwt=$(node -e "console.log(require('node:crypto').randomBytes(48).toString('base64url'))")
          admin=$(node -e "console.log(require('node:crypto').randomBytes(24).toString('base64url'))")
          echo "::add-mask::$jwt"
          echo "::add-mask::$admin"
          echo "JWT_SECRET=$jwt" >> "$GITHUB_ENV"
          echo "SEED_ADMIN_PASSWORD=$admin" >> "$GITHUB_ENV"

      - name: Generate Prisma client
        run: npx prisma generate

      # Same migration and seed steps the production container runs on start.
      - name: Apply migrations
        run: npx prisma migrate deploy

      # The integration suites read the demo catalogue. Demo data is refused in
      # production, which is NODE_ENV's default, so this step names test.
      - name: Seed database
        run: npm run db:seed
        env:
          NODE_ENV: test
          SEED_DEMO_DATA: 'true'

      - run: npm run test:integration

      # ADR-037: the backup service backs up this database, copies it off site
      # (a folder standing in for the cloud store), then restores the newest
      # off-site copy into a new database as the quarterly test does. Both runs
      # must be recorded as OK, so a change that breaks backups fails here.
      - name: Backup and restore drill
        run: |
          docker build --quiet --tag afrinov-backup:ci backup
          drill="$RUNNER_TEMP/backup"
          mkdir -p "$drill/disk" "$drill/secrets"
          chmod 777 "$drill/disk"
          node -e "console.log(require('node:crypto').randomBytes(32).toString('base64url'))" > "$drill/secrets/backup_key"
          chmod 644 "$drill/secrets/backup_key"
          backup() {
            docker run --rm --network host \
              -e PGHOST=localhost -e PGUSER=afrinov -e PGPASSWORD=afrinov -e PGDATABASE=afrinov_test \
              -e BACKUP_REMOTE=:local:/backups/offsite \
              -v "$drill/disk:/backups" -v "$drill/secrets:/run/secrets:ro" \
              --entrypoint "$1" afrinov-backup:ci "${@:2}"
          }
          backup /opt/afrinov-backup/backup.sh
          backup /opt/afrinov-backup/restore.sh latest --drill
          docker run --rm --network host -e PGPASSWORD=afrinov postgres:16-alpine \
            psql -h localhost -U afrinov -d afrinov_test -tAc \
            "SELECT kind || ' ' || status || ' ' || offsite FROM backup_runs ORDER BY finished_at DESC LIMIT 2" | tee "$drill/runs.txt"
          printf 'RESTORE_TEST OK false\nBACKUP OK true\n' | diff - "$drill/runs.txt"
