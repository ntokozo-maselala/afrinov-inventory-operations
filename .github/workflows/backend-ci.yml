name: Backend CI

on:
  pull_request:
    paths:
      - 'afrinov-platform/apps/backend/**'
      - 'afrinov-platform/package.json'
      - 'afrinov-platform/package-lock.json'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'afrinov-platform/apps/backend/**'
      - 'afrinov-platform/package.json'
      - 'afrinov-platform/package-lock.json'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: afrinov-platform/apps/backend

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Vitest 5 requires Node 22.12 or later; use the same supported major as
      # the frontend workflow and local development guidance.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: afrinov-platform/package-lock.json

      # The lockfile lives at the workspace root, so install from there.
      - name: Install dependencies
        working-directory: afrinov-platform
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  migration-drift:
    name: Migration drift and database integrity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: afrinov
          POSTGRES_PASSWORD: afrinov
          POSTGRES_DB: afrinov_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afrinov -d afrinov_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://afrinov:afrinov@localhost:5432/afrinov_test?schema=public
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: afrinov-platform/package-lock.json

      - name: Install dependencies
        working-directory: afrinov-platform
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Applies every committed migration to an empty database. A migration
      # that cannot run fails here, before it can reach a real environment.
      - name: Apply migrations to a clean database
        run: npx prisma migrate deploy

      # Proves the migrated database matches the Prisma schema exactly. A
      # missing constraint or column (like DATA-03) shows up as a non-empty
      # diff, and `--exit-code` turns that into a failing exit status (2).
      - name: Verify migrations match the schema
        run: |
          set -euo pipefail
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --script --exit-code

  integration:
    name: Integration tests (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: afrinov
          POSTGRES_PASSWORD: afrinov
          POSTGRES_DB: afrinov_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afrinov -d afrinov_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway database that only exists for the length of this job.
      DATABASE_URL: postgresql://afrinov:afrinov@localhost:5432/afrinov_test?schema=public
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: afrinov-platform/package-lock.json

      - name: Install dependencies
        working-directory: afrinov-platform
        run: npm ci

      # Fresh random values per run, so no credential is stored in this file.
      - name: Generate throwaway secrets
        run: |
          jwt=$(node -e "console.log(require('node:crypto').randomBytes(48).toString('base64url'))")
          admin=$(node -e "console.log(require('node:crypto').randomBytes(24).toString('base64url'))")
          echo "::add-mask::$jwt"
          echo "::add-mask::$admin"
          echo "JWT_SECRET=$jwt" >> "$GITHUB_ENV"
          echo "SEED_ADMIN_PASSWORD=$admin" >> "$GITHUB_ENV"

      - name: Generate Prisma client
        run: npx prisma generate

      # Same migration and seed steps the production container runs on start.
      - name: Apply migrations
        run: npx prisma migrate deploy

      # The production bootstrap must write no business data (PRA-01): a
      # demo supplier or stock movement in the system of record could never be
      # removed from the ledger.
      - name: Bootstrap seed as production writes no business data
        env:
          NODE_ENV: production
        run: |
          npm run db:seed
          npm run db:check-bootstrap

      - name: Demo seed is refused in production
        env:
          NODE_ENV: production
        run: |
          if npm run db:seed:demo; then
            echo "The demo seed ran with NODE_ENV=production" >&2
            exit 1
          fi

      # The integration suites run against the demo dataset.
      - name: Seed demo data
        env:
          NODE_ENV: test
        run: npm run db:seed:demo

      - run: npm run test:integration
