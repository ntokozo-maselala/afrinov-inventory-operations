name: Frontend CI

on:
  # Every pull request, so its checks always report and can be required on
  # main (GATE-02); the `changes` job decides whether there is anything to
  # test. See backend-ci.yml for why this is not a `paths:` filter.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'afrinov-platform/apps/frontend/**'
      - 'afrinov-platform/apps/backend/**'
      - 'afrinov-platform/package.json'
      - 'afrinov-platform/package-lock.json'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: afrinov-platform/apps/frontend

jobs:
  # Did this pull request touch the frontend, or the backend its browser
  # tests run against? As in backend-ci.yml: skipped jobs report success, the
  # diff fails open, and a push to main always runs.
  changes:
    name: 'Frontend: what changed'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - id: diff
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Both sides of a rename, and a here-string rather than a pipe, as in
          # backend-ci.yml.
          if ! changed=$(git diff --no-renames --name-only "$BASE...$HEAD"); then
            echo "::warning::Could not list the changed files; running every frontend job."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf '%s\n' "$changed"
          if grep -qE '^(afrinov-platform/apps/(frontend|backend)/|afrinov-platform/package(-lock)?\.json$|\.github/workflows/frontend-ci\.yml$)' <<< "$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the frontend jobs test changed; they are skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: 'Frontend: typecheck, lint, unit tests, build'
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Node 24, matching the backend workflow and the backend Docker image:
      # vitest 5, jsdom 30 and jest-dom 7 need Node 22 or later, and on Node 20
      # every test fails to start.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: afrinov-platform/package-lock.json

      # The lockfile lives at the workspace root, so install from there.
      - name: Install dependencies
        working-directory: afrinov-platform
        run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # A production build: it also fails if VITE_FRONTEND_ONLY or
      # VITE_DEMO_AUTH_ENABLED is set (src/config/buildGuard.ts).
      - run: npm run build

  # System audit H5: the browser tests (apps/frontend/e2e) gate a change. They
  # sign in, sign out and meet failures in a real browser against the real
  # backend and a throwaway database, as apps/backend/README.md describes.
  e2e:
    name: 'Frontend: browser tests (Playwright, real backend)'
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: afrinov
          POSTGRES_PASSWORD: afrinov
          POSTGRES_DB: afrinov_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afrinov -d afrinov_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway database that only exists for the length of this job.
      DATABASE_URL: postgresql://afrinov:afrinov@localhost:5432/afrinov_test?schema=public
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: afrinov-platform/package-lock.json

      - name: Install dependencies
        working-directory: afrinov-platform
        run: npm ci

      # Fresh random value per run, so no credential is stored in this file.
      # The suite's backend makes its own JWT secret.
      - name: Generate throwaway admin password
        run: |
          admin=$(node -e "console.log(require('node:crypto').randomBytes(24).toString('base64url'))")
          echo "::add-mask::$admin"
          echo "SEED_ADMIN_PASSWORD=$admin" >> "$GITHUB_ENV"

      - name: Generate Prisma client
        working-directory: afrinov-platform/apps/backend
        run: npx prisma generate

      - name: Apply migrations
        working-directory: afrinov-platform/apps/backend
        run: npx prisma migrate deploy

      - name: Seed database
        working-directory: afrinov-platform/apps/backend
        run: npm run db:seed
        env:
          NODE_ENV: test
          SEED_DEMO_DATA: 'true'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # e2e/global-setup.ts starts the backend on 4000 and Vite on 5173.
      - name: Run browser tests
        run: npx playwright test
        env:
          CI: 'true'
