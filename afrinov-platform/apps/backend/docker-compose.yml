services:
  db:
    image: postgres:16-alpine
    environment:
      # Local/demo credentials only. Supply POSTGRES_USER / POSTGRES_PASSWORD /
      # POSTGRES_DB from the environment (or a secret manager) for any
      # deployment that is reachable beyond this machine.
      POSTGRES_USER: ${POSTGRES_USER:-afrinov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${POSTGRES_TEST_PASSWORD:?set POSTGRES_PASSWORD or POSTGRES_TEST_PASSWORD in the environment}}
      POSTGRES_DB: ${POSTGRES_DB:-afrinov}
    ports:
      - "5432:5432"
    volumes:
      - afrinov_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Separate, opt-in database for the real-PostgreSQL test suites. Its own
  # volume and loopback-only port prevent tests from sharing the dev database.
  test-db:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:-afrinov}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD or POSTGRES_TEST_PASSWORD in the environment}}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-afrinov_test}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - afrinov_test_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      # The Dockerfile is written against the workspace root: its first COPY
      # pulls the root package.json and lockfile, so context must be ../.. from
      # this apps/backend directory.
      context: ../..
      dockerfile: apps/backend/Dockerfile
    environment:
      # Assembled from injected parts so the database credential is never
      # written into this file.
      DATABASE_URL: postgresql://${POSTGRES_USER:-afrinov}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-afrinov}?schema=public
      # loadConfig() rejects known-insecure secrets when NODE_ENV=production.
      # Generate with:
      #   node -e "console.log(require('node:crypto').randomBytes(48).toString('base64url'))"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the environment}
      # Fail-closed: this defaults to production, not development. The previous
      # default of "development" disabled the insecure-secret guard and enabled
      # development CORS defaults inside the container.
      NODE_ENV: ${NODE_ENV:-production}
      # Comma-separated allow-list. Required in production; CORS is disabled
      # when unset.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # Purchase orders and goods receipts are on unless this is "false".
      PROCUREMENT_ENABLED: ${PROCUREMENT_ENABLED:-true}
      # API docs at /api/docs. Off in production unless this is "true".
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-}
      # Password for the admin account the seed creates on first start. The
      # current production seed checks this before looking up the existing
      # admin, so keep it injected on every Compose startup.
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    # Seed is idempotent. Run the compiled seed (node dist/db/seed.js) rather
    # than `npm run db:seed`, which needs tsx — a dev dependency that is
    # pruned from the production image. The current seed requires
    # SEED_ADMIN_PASSWORD on every production invocation (see above).
    command: sh -c "npx prisma migrate deploy && node dist/db/seed.js && node dist/index.js"

volumes:
  afrinov_pg:
  afrinov_test_pg:
