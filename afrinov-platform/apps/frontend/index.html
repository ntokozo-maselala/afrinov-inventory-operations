<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E3001B" />
    <meta name="description" content="Afrinov OMS — the Afrinov Operations Management System, for materials, stock movements, procurement, projects and reporting." />
    <!-- Icons are built from public/favicon.svg and src/assets/icon/afrinov-mark.svg by `npm run icons`.
         sizes="32x32" on the ICO lets browsers that read SVG prefer the SVG. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      (() => {
        let theme = 'light';
        try {
          const current = localStorage.getItem('afrinov.appearance.theme.v1');
          if (current === 'light' || current === 'dark' || current === 'system') {
            theme = current;
          } else {
            const legacy = JSON.parse(localStorage.getItem('afrinov.settings.v1') || 'null');
            if (legacy && ['light', 'dark', 'system'].includes(legacy.theme)) theme = legacy.theme;
          }
        } catch {
          // A blocked or invalid storage value falls back to light mode.
        }
        const dark = theme === 'dark' || (theme === 'system' && typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches);
        const root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.dataset.theme = theme;
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <title>Afrinov OMS</title>
  </head>
  <body class="bg-surface-50 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
